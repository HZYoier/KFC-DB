<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}主数据{% endblock %} · KFC 门店运营</title>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa; --accent:#b31917; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; }
  header h1 { margin:0; font-size:16px; }
  header .sub { color:var(--muted); font-size:12px; }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 24px; background:#fff; border-bottom:1px solid var(--line); }
  nav a { padding:4px 10px; border-radius:6px; color:var(--fg); text-decoration:none; }
  nav a:hover { background:var(--bg); }
  nav a.on { background:var(--accent); color:#fff; }
  main { padding:20px 24px 48px; max-width:1200px; }
  h2 { font-size:15px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { background:var(--bg); font-weight:600; font-size:12px; color:var(--muted); }
  td.num { font-variant-numeric:tabular-nums; }
  .empty { padding:16px; color:var(--muted); background:#fff; border:1px solid var(--line); }
  .notice, .error { padding:8px 12px; border-radius:6px; margin-bottom:12px; }
  .notice { background:#dafbe1; border:1px solid #4ac26b; }
  .error { background:#ffebe9; border:1px solid #ff8182; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .card { display:block; padding:16px; background:#fff; border:1px solid var(--line); border-radius:8px; text-decoration:none; color:var(--fg); }
  .card:hover { border-color:var(--accent); }
  .card b { display:block; font-size:15px; }
  .card span { color:var(--muted); font-size:12px; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; }
  form fieldset { border:0; padding:0; margin:0; width:100%; }
  form legend { font-size:12px; color:var(--muted); padding:0; margin-bottom:4px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:2px; }
  input, select, textarea { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  textarea { min-height:60px; width:260px; }
  button { font:inherit; padding:5px 14px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
  button.quiet { background:#fff; color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>KFC 门店运营 · 主数据与定价</h1>
  <div class="sub">店长维护页 · 数据经 <code>sp_list_master_records</code> 与 04 的写过程进出，页面不读基表</div>
</header>
<nav>
  <a href="{{ url_for('master.index') }}" class="{{ 'on' if request.endpoint == 'master.index' }}">总览</a>
  {% for slug, item in entities.items() %}
  <a href="{{ url_for('master.list_view', entity=slug) }}"
     class="{{ 'on' if entity is defined and entity == slug }}">{{ item.title }}</a>
  {% endfor %}
</nav>
<main>
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
