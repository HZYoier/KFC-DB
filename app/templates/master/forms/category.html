<form method="post" action="{{ url_for('master.do_action', entity='category', action='create') }}">
  <fieldset><legend>新建分类</legend></fieldset>
  <label>名称<input name="category_name" maxlength="50" required></label>
  <button type="submit">新建</button>
</form>
<form method="post" action="{{ url_for('master.do_action', entity='category', action='status') }}">
  <fieldset><legend>改分类状态</legend></fieldset>
  <label>分类ID<input name="category_id" type="number" min="1" required></label>
  <label>状态<select name="status"><option>ACTIVE</option><option>INACTIVE</option></select></label>
  <button type="submit">提交</button>
</form>
