<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单操作提示 · KFC-DB</title>
  {% include 'orders/theme.html' %}
</head>
<body>
<header class="topbar"><div class="shell"><div class="brand">
  <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="brand-name">KFC-DB</span><span class="brand-sub">门店运营</span>
</div></div></header>
<main class="shell">
  <section class="panel error-panel" aria-labelledby="error-heading">
    <div class="panel-head"><h2 id="error-heading">本次操作未确认成功</h2></div>
    <div class="panel-body">
      <p>{{ message }}</p>
      {% if lookup.lookup %}<p>订单号：<span class="order-no">{{ lookup.lookup }}</span>。请先核对结果，不要换号重下。</p>{% endif %}
      <p><a class="btn primary" href="{{ url_for('orders.index', **lookup) }}">返回订单工作台</a></p>
    </div>
  </section>
</main>
</body>
</html>
