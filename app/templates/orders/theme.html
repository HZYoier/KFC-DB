<style>
:root{
  color-scheme:light;--red:#c8102e;--red-dark:#a30d25;--red-soft:#fff0f2;
  --paper:#f7f5f3;--white:#fff;--ink:#211c1d;--muted:#62595a;--line:#e9e2e0;
  --mono:"Cascadia Mono",Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif}
a{color:var(--red-dark);text-underline-offset:.2em}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #de4160;outline-offset:2px}
.shell{width:min(100% - 56px,1240px);margin-inline:auto}
.topbar{background:var(--white);border-top:4px solid var(--red);border-bottom:1px solid var(--line)}
.topbar .shell,.intro,.panel-head,.form-footer,.page-footer{display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar .shell{min-height:65px}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.035em}
.brand-mark{display:flex;gap:4px;height:25px;padding-inline:1px}
.brand-mark i{width:5px;background:var(--red)}
.brand-name{font-size:19px;letter-spacing:-.025em}
.brand-sub{color:var(--muted);font-size:12px;font-weight:500;border-left:1px solid var(--line);padding-left:12px}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.identity{color:var(--red-dark);background:var(--red-soft);border-radius:5px;padding:5px 9px;font-weight:650;white-space:nowrap}
.intro{align-items:flex-end;padding-block:30px 21px}
.eyebrow{margin:0;color:var(--red-dark);font-size:12px;font-weight:750;letter-spacing:.15em}
h1{font-size:clamp(27px,4vw,36px);line-height:1.2;letter-spacing:-.035em;margin:5px 0 6px}
h2{font-size:18px;line-height:1.4;margin:0}
h3{font-size:14px;margin:0}
p{margin:0}
.muted,.intro p:last-child,.panel-head p{color:var(--muted)}
.queue-link{white-space:nowrap}
.workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.workspace.cashier{grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr)}
.workspace.rider{grid-template-columns:repeat(2,minmax(0,1fr))}
.workspace.manager{grid-template-columns:minmax(0,1.85fr) minmax(280px,1fr)}
.stack{min-width:0;display:grid;gap:16px;align-content:start}
.panel{min-width:0;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-head{padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-head p{font-size:12px;margin-top:2px}
.panel-body{padding:16px 18px}
.count{font:600 12px/1.4 var(--mono);border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:3px 7px;white-space:nowrap}
.scroll{max-width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}
th{background:#faf8f7;color:var(--muted);font-weight:650;font-size:12px;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fdf8f8}
tr.selected{background:var(--red-soft)}
.order-no{font-family:var(--mono);font-size:11px;overflow-wrap:anywhere;min-width:108px}
.pickup-code{font:700 13px/1.4 var(--mono);letter-spacing:.035em;overflow-wrap:anywhere}
.amount{white-space:nowrap;font-weight:650}
.action-cell{white-space:nowrap}
.badge{display:inline-block;white-space:nowrap;border-radius:5px;background:#f3efed;color:#574b4b;padding:3px 7px;font-size:12px;font-weight:650}
.badge.pending{background:var(--red-soft);color:var(--red-dark)}
.badge.active{background:#fff3db;color:#744700}
.badge.ready{background:#e8f4ea;color:#255b35}
.empty{padding:21px 18px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:7px;background:var(--white);color:var(--ink);font-family:inherit;font-size:13px;font-weight:650;line-height:1.25;min-height:37px;padding:8px 12px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper);border-color:#cfc3c1}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.small{min-height:31px;padding:5px 9px;font-size:12px}
.field{min-width:0;display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:650}
input,select{width:100%;min-width:0;min-height:37px;border:1px solid #d7ccca;border-radius:7px;background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:6px 9px}
select{padding-right:7px}
.form-stack{display:grid;gap:12px}
.inline-form{display:flex;align-items:end;gap:8px}
.inline-form .field{flex:1}
.fields{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:10px}
.line-items{display:grid;gap:7px}
.line-item{display:grid;grid-template-columns:23px minmax(0,1fr) 69px;align-items:center;gap:8px}
.line-index{color:var(--muted);font:12px var(--mono);text-align:center}
.draft{background:var(--paper);border-radius:7px;padding:8px 10px;color:var(--muted);font-size:12px}
.draft strong{display:block;color:var(--ink);font:650 12px/1.5 var(--mono);overflow-wrap:anywhere}
.form-footer{justify-content:flex-end}
.hint{color:var(--muted);font-size:12px}
.recent{margin-top:12px;display:grid;gap:3px;font-size:12px}
.recent a{font-family:var(--mono);overflow-wrap:anywhere}
.payment-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;background:var(--red-soft)}
.payment-meta strong{color:var(--red-dark);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.payment-meta small{display:block;color:var(--muted)}
.subhead{padding:12px 18px 7px;color:var(--muted)}
.notice{margin-bottom:15px;padding:10px 13px;border:1px solid #bedbc4;background:#edf7ef;color:#255b35;border-radius:7px}
.status-panel{margin-bottom:16px}
.page-footer{padding-block:18px 24px;color:var(--muted);font-size:12px}
.error-panel{max-width:620px;margin:36px auto}
.error-panel p+p{margin-top:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:950px){.workspace.cashier,.workspace.rider,.workspace.manager{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){
  .shell{width:calc(100% - 24px)}.topbar .shell{min-height:59px}.brand-sub{display:none}
  .top-actions{gap:6px}.intro{align-items:flex-start;padding-block:22px 16px}
  .panel-head,.panel-body{padding-inline:12px}.page-footer{flex-wrap:wrap}
  th,td{padding:9px}.fields{grid-template-columns:1fr}
}
</style>
