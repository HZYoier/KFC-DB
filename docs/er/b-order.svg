<text x="80" y="1172" font-size="16">业务补充：成功订单至少一条 SELLABLE；COMPONENT 必须同单且父为 SELLABLE；这些额外规则由过程保证。</text>
<text x="80" y="1194" font-size="16">支付后恰好一 Payment / PointLedger；仅外送完成制作后有 Delivery；认领前 rider_employee_id 为空。</text>
<text x="80" y="1216" font-size="16">UK pickup_code：仅非 NULL 子集过滤唯一（见 SalesOrder 字段），不是全表候选码。重复顶层商品规则见 I-B08。</text>
<text x="80" y="1238" font-size="16">源码核验产物，非本轮活库验收；关系全名、业务条件与保证机制见 business-rule-mapping.md。</text>
